trainer:
  max_epochs: 100
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      resume: allow
      project: "eomt"
      name: "iscar_bp_panoptic_eomt_large_1280_dinov3"
model:
  class_path: training.mask_classification_panoptic.MaskClassificationPanoptic
  init_args:
    ckpt_path: "checkpoints/eomt_large_640.bin"
    num_classes: 2
    load_ckpt_class_head: False
    use_area_weighting: True
    attn_mask_annealing_enabled: True
    # Derived for the IS monocular_dataset: 14,178 train frames / batch_size 1
    # = 14,178 steps/epoch * 100 epochs = 1,417,800 total steps.
    # COCO fractional positions preserved: block-0 anneals over the first
    # ~4% (3000/73910), blocks 1-3 over [40-60%], [60-80%], [80-100%].
    # NOTE: the dataset is currently 640x640 — this 1280 config upscales it 2x
    # for no extra signal. Prefer eomt_large_640.yaml unless the data is
    # regenerated at 1280.
    attn_mask_annealing_start_steps: [0, 567120, 850680, 1134240]
    attn_mask_annealing_end_steps: [57548, 850680, 1134240, 1417800]
    # Halve LR when image scale doubles (token count ~4x → conservative).
    lr: 1e-4
    llrd_l2_enabled: False
    warmup_steps: [2000, 3000]
    delta_weights: True
    # Depth head (DA3 mono recipe). Coefficient 1.0 to start; tune if depth
    # gradient dominates the existing mask/class/occlusion losses.
    depth_coefficient: 1.0
    network:
      class_path: models.eomt.EoMT
      init_args:
        enable_occlusion: True
        num_q: 200
        # 4 intermediate-feature taps for the DPT depth head, mirroring DA3's
        # da3mono-large.yaml (out_layers: [4, 11, 17, 23]) on a 24-block
        # ViT-L. DINOv3 feature distribution differs from DINOv2 so these
        # are a starting point; tune empirically.
        depth_taps: [4, 11, 17, 23]
        # Prepend a UniDepth-V1-style cam_token derived from intrinsics + image
        # size to the ViT sequence. Rationale in CLAUDE.md (FOV conditioning,
        # multi-camera deployment). Set to false to drop the intrinsics_mlp
        # entirely and run unconditioned monocular depth (matches da3mono-large).
        use_intrinsics: true
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: facebook/dinov3-vitl16-pretrain-lvd1689m

data:
  class_path: datasets.iscar_bp.ReplicatorDataModule
  init_args:
    path: "/home/kaelin/BinPicking/SDG/IS/Outputs/monocular_dataset"
    stuff_classes: [0]
    num_classes: 2
    img_size: [1280, 1280]
    # Drop batch size to 1: token count ~4x at 1280×1280, attention is
    # O(N^2) so attention memory ~13x. Bump if you've got headroom.
    batch_size: 1
    # Disable scale jitter: rescaling the image while keeping metric depth
    # values is geometrically inconsistent (DA3 mono training avoids it).
    scale_range: [1.0, 1.0]
    color_jitter_enabled: True
    num_workers: 4
